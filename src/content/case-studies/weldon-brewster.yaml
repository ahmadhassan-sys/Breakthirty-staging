- type: overview
  label: Project Overview
  heading: We started with his photography brand. Then came a film studio, then a private gallery.
  body:
  - 'Weldon Brewster is a Los Angeles photographer with nearly four decades on construction sites and landmark builds, from
    Frank Gehry’s The Grand in LA to the I-35 bridge in a Minnesota January. Since 2024 we’ve built three things for him,
    in this order:'
  - '01:  A rebrand and new website for Weldon Brewster Photography.

    02: A brand-new brand and website for Structural Stories, the film studio he launched next.

    03: A private gallery where his clients view and download their photos.'
