- type: challenge
  label: The challenge
  heading: His brand, his business and his tools had all fallen behind his work.
  body:
  - His photography brand didn’t feel as premium as his work. Then he started Structural Stories, a film studio for a different
    kind of client, and it needed a name of its own.
  - Every shoot was delivered through a hosted gallery service he couldn’t change. He couldn’t add features or organise his
    photos his own way, and the archive kept growing.
